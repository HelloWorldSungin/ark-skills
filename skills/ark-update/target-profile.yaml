# ark-update target profile — declarative authoritative state for HEAD-conformant downstream projects.
# See spec (.omc/specs/deep-interview-ark-update-framework.md) and plan (.omc/plans/ralplan-ark-update.md)
# for schema documentation.
#
# v2.0.0 NOTE — the v1 managed regions (omc-routing, routing-rules) and the retired
# chain-router state-dir gitignore entry were RETIRED in the v2.0.0 restructure. v2 has
# no CLAUDE.md routing block: the `/ark-consult` workflow consultant IS the router, and it
# holds no downstream-project state. The two v2 conventions (OKF knowledge bundles +
# GitHub-Issues task management) are procedural migrations, declared under
# `pending_migrations` below and executed per-project later (deferred; not run by this
# effort). Each managed/ensured entry carries:
#   since:    the plugin version that introduced this convention (matches CHANGELOG.md)
#   version:  the template version currently emitted by the marker.
schema_version: 1

# No CLAUDE.md managed regions in v2. Routing is the consultant's job, not a template.
managed_regions: []

# No ark-managed gitignore entries in v2 (the chain-router state dir retired with it).
ensured_gitignore: []

ensured_files:
  # v1.11.0 — centralized-vault setup script. Retained: vault externalization is
  # orthogonal to the v2 restructure (not a deleted skill). Gated: only applies when the
  # project chose centralized vault layout (no opt-out row in CLAUDE.md).
  - id: setup-vault-symlink
    op: create_file_from_template
    target: scripts/setup-vault-symlink.sh
    template: setup-vault-symlink.sh
    since: 1.11.0
    version: 1.11.0
    only_if_centralized_vault: true
    mode: "0o755"

ensured_mcp_servers: []
# No MCP servers are mandatory across all downstream projects.

# ---------------------------------------------------------------------------
# pending_migrations — the v2.0.0 conventions. AUTHORED here; execution is deferred
# and runs per-project (ArkNode-AI is already converged). These are procedural
# (Phase-1-style) migrations, not declarative managed regions: they rewrite vault
# format and task-tracking wholesale, so they are authored as runbooks the operator
# drives via /ark-onboard blocks, not auto-applied on every /ark-update run.
# ---------------------------------------------------------------------------
pending_migrations:
  - id: okf-conversion
    since: 2.0.0
    status: pending
    description: >-
      Convert the project's vault to an OKF v0.1 knowledge bundle. Wraps the OKF
      playbook's 7-step recipe: copy _meta/okf tooling → normalize_frontmatter.py
      --apply → convert_links.py --apply (wikilinks → relative markdown) → hand-write
      missing description: values → generate-index.py → okf_lint.py to 0 errors →
      declare okf_version "0.1" in index.md. Freezes any Session-Logs/ and TaskNotes/
      trees with banners.
    runbook: /ark-onboard Block A (OKF bundle init) + Migration path
    verify: python3 vault/_meta/okf/okf_lint.py --quiet  # exit 0

  - id: gh-issues-adoption
    since: 2.0.0
    status: pending
    description: >-
      Adopt GitHub Issues task management. Bootstraps the label taxonomy (triage +
      type + priority + component families), runs /setup-matt-pocock-skills (writes
      docs/agents/{issue-tracker,triage-labels,domain}.md + the CLAUDE.md Agent-skills
      block), merges the ark proactive-behavior conventions, freezes legacy trackers,
      and rewrites the CLAUDE.md Task Management row to point at GitHub Issues.
    runbook: /ark-onboard Block B (GitHub Issues conventions) + Block C (CLAUDE.md rows)
    verify: gh label list  # triage+type+priority+component families present
