# ark-update target profile — declarative authoritative state for HEAD-conformant downstream projects.
# See spec (.omc/specs/deep-interview-ark-update-framework.md) and plan (.omc/plans/ralplan-ark-update.md)
# for schema documentation.
#
# v2.0.0 NOTE — the v1 managed regions (omc-routing, routing-rules) and the retired
# chain-router state-dir gitignore entry were RETIRED in the v2.0.0 restructure. v2 has
# no CLAUDE.md routing block: the `/ark-consult` workflow consultant IS the router, and it
# holds no downstream-project state. The two v2 conventions (OKF knowledge bundles +
# GitHub-Issues task management) are procedural migrations, declared under
# `pending_migrations` below and executed per-project later (deferred; not run by this
# effort). Each managed/ensured entry carries:
#   since:    the plugin version that introduced this convention (matches CHANGELOG.md)
#   version:  the template version currently emitted by the marker.
schema_version: 1

# v2.2.0 — the vault-awareness convention (epic #41): an ark-marked CLAUDE.md region that
# tells downstream agents to consult the vault before non-trivial work and distill via
# /vault at session end. Converged idempotently by the existing ensure_claude_md_section op
# (no new engine code). Routing is still the consultant's job, not a managed region.
managed_regions:
  - id: vault-awareness
    op: ensure_claude_md_section
    file: CLAUDE.md
    template: vault-awareness-block.md
    since: 2.2.0
    version: 2.2.0

# No ark-managed gitignore entries in v2 (the chain-router state dir retired with it).
ensured_gitignore: []

ensured_files:
  # v1.11.0 — centralized-vault setup script. Retained: vault externalization is
  # orthogonal to the v2 restructure (not a deleted skill). Gated: only applies when the
  # project chose centralized vault layout (no opt-out row in CLAUDE.md).
  - id: setup-vault-symlink
    op: create_file_from_template
    target: scripts/setup-vault-symlink.sh
    template: setup-vault-symlink.sh
    since: 1.11.0
    version: 1.11.0
    only_if_centralized_vault: true
    mode: "0o755"

ensured_mcp_servers: []
# No MCP servers are mandatory across all downstream projects.

# ---------------------------------------------------------------------------
# pending_migrations — the v2.0.0 conventions. These are procedural (Phase-1-style)
# destructive migrations, not declarative managed regions: they rewrite vault format
# and task-tracking wholesale.
#
# schema (issue #34):
#   id:      stable migration id (also the per-project marker key)
#   op:      registered DestructiveOp type (DESTRUCTIVE_OP_REGISTRY)
#   since:   plugin version that introduced the convention
#   status:  plugin-side IMPLEMENTATION lifecycle — `pending` (declared, no engine
#            impl) | `active` (engine-implemented, available to run) | `retired`.
#            This is NOT per-project state: this file is shared by every downstream
#            project. The per-project terminal state ("has THIS project run it?")
#            lives in `.ark/pending-migrations.json`, written by the engine on success.
#
# Execution stays deferred + opt-in: the engine only dispatches these under
# `--run-pending-migrations` (env ARK_RUN_PENDING_MIGRATIONS=1). A default
# `/ark-update` run ignores them, so downstream convergence is a deliberate step.
# ---------------------------------------------------------------------------
pending_migrations:
  - id: okf-conversion
    op: okf_conversion
    since: 2.0.0
    status: active
    vault: vault
    description: >-
      Convert the project's vault to an OKF v0.1 knowledge bundle. Wraps the OKF
      playbook's 7-step recipe: copy _meta/okf tooling → normalize_frontmatter.py
      --apply → convert_links.py --apply (wikilinks → relative markdown) →
      generate-index.py → okf_lint.py to 0 errors → declare okf_version "0.1" in
      index.md. Freezes any Session-Logs/ and TaskNotes/ trees with banners.
    runbook: /ark-onboard Block A (OKF bundle init) + Migration path
    verify: python3 vault/_meta/okf/okf_lint.py --quiet  # exit 0

  - id: gh-issues-adoption
    op: gh_issues_adoption
    since: 2.0.0
    status: active
    component_labels: [consultant, conventions, vault, onboarding]
    description: >-
      Adopt GitHub Issues task management. Bootstraps the label taxonomy (triage +
      type + priority + component families), writes
      docs/agents/{issue-tracker,triage-labels,domain}.md with the ark
      proactive-behavior conventions, freezes legacy trackers, and rewrites the
      CLAUDE.md Task Management row to point at GitHub Issues.
    runbook: /ark-onboard Block B (GitHub Issues conventions) + Block C (CLAUDE.md rows)
    verify: gh label list  # triage+type+priority+component families present
